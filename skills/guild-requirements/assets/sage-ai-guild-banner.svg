<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Sage AI Guild</title>
  <desc id="desc">Sage AI Guild engineering platform requirements header in green, black and white.</desc>
  <!-- Palette taken from theme1.xml in the supplied Sage kickoff presentation.
       This is a document header using ordinary text, not a recreated corporate logo. -->
  <rect width="1200" height="160" fill="#000000"/>
  <rect x="40" y="38" width="6" height="80" rx="3" fill="#00D639"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="78" font-size="34" font-weight="700" fill="#00D639">Sage</text>
    <text x="175" y="78" font-size="34" font-weight="700" fill="#FFFFFF">AI Guild</text>
    <text x="70" y="113" font-size="20" fill="#FFFFFF">Engineering platform requirements</text>
  </g>
</svg>
